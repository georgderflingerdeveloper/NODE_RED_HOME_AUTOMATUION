<script>
(function () {
  const phone = window.matchMedia('(max-width: 700px)');
  const requested = new URLSearchParams(location.search).get('handy') === '1';
  function apply() {
    document.documentElement.classList.toggle('gh-mobile', requested || phone.matches);
  }
  if (window.georgMobileLayoutCleanup) window.georgMobileLayoutCleanup();
  const toggle = document.createElement('button');
  toggle.id = 'gh-mobile-pages';
  toggle.type = 'button';
  toggle.setAttribute('aria-expanded', 'false');
  function collapse() {
    toggle.setAttribute('aria-expanded', 'false');
  }
  function syncMenu() {
    const nav = document.querySelector('md-sidenav');
    if (!nav) return;
    if (toggle.parentNode !== nav) nav.prepend(toggle);
    const current = nav.querySelector('.nr-menu-item-active p')?.textContent.trim();
    const label = 'Bereiche · ' + (current || 'Auswählen');
    if (toggle.textContent !== label) toggle.textContent = label;
  }
  toggle.onclick = () => toggle.setAttribute('aria-expanded', String(toggle.getAttribute('aria-expanded') !== 'true'));
  function handleClick(event) {
    if (event.target.closest('md-sidenav md-list-item')) collapse();
  }
  function handleKey(event) {
    if (event.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true') {
      collapse();
      toggle.focus();
    }
  }
  const observer = new MutationObserver(syncMenu);
  // Listen for dashboard startup and navigation without observing live widget data.
  function attach() {
    syncMenu();
    if (toggle.parentNode) {
      observer.disconnect();
      observer.observe(toggle.parentNode, {subtree:true, attributes:true, attributeFilter:['class']});
    }
  }
  const mounted = new MutationObserver(() => {
    if (document.querySelector('md-sidenav')) { attach(); mounted.disconnect(); }
  });
  if (document.querySelector('md-sidenav')) attach();
  else mounted.observe(document.documentElement, {subtree:true, childList:true});
  apply();
  phone.addEventListener('change', apply);
  document.addEventListener('click', handleClick);
  document.addEventListener('keydown', handleKey);
  window.georgMobileLayoutCleanup = () => {
    phone.removeEventListener('change', apply);
    mounted.disconnect();
    observer.disconnect();
    document.removeEventListener('click', handleClick);
    document.removeEventListener('keydown', handleKey);
    toggle.remove();
  };
})();
</script>
