<style>
:root{--gh-page:#1c1c1c;--gh-card:#303030;--gh-inset:#242424;--gh-control:#444444;--gh-border:#626262;--gh-text:#f1f1f1;--gh-muted:#c6c6c6;}
:root[data-gh-theme="grays"]{--gh-page:#1c1c1c;--gh-card:#303030;--gh-inset:#242424;--gh-control:#444444;--gh-border:#626262;--gh-text:#f1f1f1;--gh-muted:#c6c6c6;}
:root[data-gh-theme="dark"]{--gh-page:#111316;--gh-card:#202328;--gh-inset:#181b1f;--gh-control:#353b43;--gh-border:#737d89;--gh-text:#f4f5f7;--gh-muted:#c4cbd3;}
:root[data-gh-theme="blues"]{--gh-page:#17212c;--gh-card:#253647;--gh-inset:#1d2c3b;--gh-control:#3c536c;--gh-border:#8196ae;--gh-text:#f0f5fb;--gh-muted:#c4d3e3;}
:root[data-gh-theme="greens"]{--gh-page:#1b2420;--gh-card:#2c3b33;--gh-inset:#223029;--gh-control:#445b4c;--gh-border:#8b9e8f;--gh-text:#f1f6f1;--gh-muted:#cad8cc;}

/* Nur Dashboard-Flächen, keine Statuslampen oder Leistungsanzeigen überschreiben. */
body.nr-dashboard-theme,body.nr-dashboard-theme md-content{background-color:var(--gh-page)!important;color:var(--gh-text)!important}
body.nr-dashboard-theme md-toolbar,body.nr-dashboard-theme md-sidenav,body.nr-dashboard-theme md-sidenav md-content{background-color:var(--gh-inset)!important;color:var(--gh-text)!important}
body.nr-dashboard-theme md-card,body.nr-dashboard-theme .nr-dashboard-cardpanel{background-color:var(--gh-card)!important;color:var(--gh-text)!important;border-color:var(--gh-border)!important}
body.nr-dashboard-theme .nr-dashboard-cardtitle{color:var(--gh-text)!important}
.gh-theme-picker{color:var(--gh-text);padding:12px}
.gh-theme-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.gh-theme-option{background:var(--gh-card);color:var(--gh-text);border:1px solid rgba(180,190,200,.25);border-radius:10px;padding:14px;text-align:left;cursor:pointer;min-height:100px}
.gh-theme-option[aria-pressed="true"]{border-color:var(--gh-text);box-shadow:inset 0 -2px 0 var(--gh-muted)}
.gh-theme-option:focus-visible{outline:2px solid var(--gh-text);outline-offset:3px}
.gh-theme-swatch{display:flex;height:22px;margin-bottom:10px;border-radius:5px;overflow:hidden}
.gh-theme-swatch span{flex:1}
.gh-theme-picker p{line-height:1.6}
/* Text braucht keine eigenen Flächen. Konturen nur zur Gliederung der Karten.
   Semantische Statuschips, LEDs und Preiskennzeichnungen behalten ihre Farben. */
body.nr-dashboard-theme .nr-dashboard-template :is(h1,h2,h3,h4,h5,h6,p){background:transparent!important;box-shadow:none!important;border:0!important}
body.nr-dashboard-theme :is(.ha-scheduler .sc-card,.lc-card,.ph-discovery .box){border-color:rgba(180,190,200,.16);box-shadow:0 2px 8px rgba(0,0,0,.08)}
body.nr-dashboard-theme .nr-dashboard-cardpanel{border-color:rgba(180,190,200,.14)!important}
body.nr-dashboard-theme :is(.ha-scheduler,.ph-discovery) :is(td,th){border-bottom-color:rgba(180,190,200,.18)}

/* Navigation: Räume zuerst, technische Seiten darunter. Selektoren verwenden
   stabile Icons statt Seitennummern; versteckte Tabs verschieben keine Gruppen. */
body.nr-dashboard-theme md-sidenav md-list{padding:12px 10px 20px}
body.nr-dashboard-theme md-sidenav md-list-item{position:relative;margin:3px 0;border-radius:10px;min-height:46px;overflow:visible}
body.nr-dashboard-theme md-sidenav md-list-item .md-button{border-radius:10px}
body.nr-dashboard-theme md-sidenav md-list-item p{font-size:13px;font-weight:500;letter-spacing:.035em}
body.nr-dashboard-theme md-sidenav md-list-item ui-icon{display:flex;align-items:center;justify-content:center;width:34px;min-width:34px;height:34px;border-radius:9px;background:var(--gh-card);color:var(--gh-muted)}
body.nr-dashboard-theme md-sidenav .nr-menu-item-active{background:var(--gh-control);box-shadow:inset 3px 0 0 var(--gh-text)}
body.nr-dashboard-theme md-sidenav .nr-menu-item-active ui-icon{color:var(--gh-text);background:var(--gh-inset)}
body.nr-dashboard-theme md-sidenav md-list-item:has(ui-icon[icon="home"]),
body.nr-dashboard-theme md-sidenav md-list-item:has(ui-icon[icon="wb_cloudy"]){margin-top:36px}
body.nr-dashboard-theme md-sidenav md-list-item:has(ui-icon[icon="home"])::after,
body.nr-dashboard-theme md-sidenav md-list-item:has(ui-icon[icon="wb_cloudy"])::after{position:absolute;left:12px;top:-27px;z-index:1;opacity:1;color:var(--gh-muted);font-size:10px;font-weight:700;letter-spacing:.14em;pointer-events:none;white-space:nowrap}
body.nr-dashboard-theme md-sidenav md-list-item:has(ui-icon[icon="home"])::after{content:"RÄUME"}
body.nr-dashboard-theme md-sidenav md-list-item:has(ui-icon[icon="wb_cloudy"])::after{content:"SYSTEM & DIENSTE"}
body.nr-dashboard-theme md-sidenav md-list-item .md-button:focus-visible{outline:2px solid var(--gh-text);outline-offset:-3px}

  #home-automation-project-status { display:flex; align-items:center; gap:8px; flex:1; min-width:0; margin-left:12px; font-family:Roboto,Arial,sans-serif; }

  #home-automation-project-status .ha-status-chip { color:#fff; font-size:12px; line-height:18px; white-space:nowrap; }
  #home-automation-project-status .ha-status-branch { max-width:280px; overflow:hidden; text-overflow:ellipsis; }

  #home-automation-project-info-panel { position:fixed; z-index:10000; top:56px; right:12px; width:min(620px,calc(100vw - 24px)); max-height:calc(100vh - 72px); overflow:auto; box-sizing:border-box; padding:16px; border:1px solid var(--gh-border,#626262); border-radius:11px; background:var(--gh-card,#303030); color:var(--gh-text,#f1f1f1); box-shadow:0 10px 28px rgba(0,0,0,.45); font-family:Roboto,Arial,sans-serif; }
  #home-automation-project-info-panel[hidden] { display:none; }

  #nr-dashboard-toolbar { gap:8px; padding:0 16px; }
  #nr-dashboard-toolbar h1 { flex-shrink:0; margin:0; font-size:21px; font-weight:750; letter-spacing:.02em; white-space:nowrap; }
  #home-automation-project-status .ha-status-project, #home-automation-project-status .ha-status-branch { display:none; }
  #home-automation-project-status .ha-status-version { padding:2px 7px; border:1px solid var(--gh-border,#626262); border-radius:6px; font-size:11px; }
  #home-automation-project-info-button { flex-shrink:0; width:25px; min-width:25px; height:25px; font-size:14px; margin:0; }
  #home-automation-project-hash { order:10; flex-shrink:0; color:var(--gh-muted,#c6c6c6); font:11px/1.4 monospace; letter-spacing:.03em; margin-left:8px; white-space:nowrap; }
  #dashboard-reconnect-button { min-width:30px; padding:0 6px; font-size:11px; letter-spacing:.02em; }
  #clock { white-space:nowrap; font-size:13px; line-height:1.35; margin:0; font-variant-numeric:tabular-nums; }
  @media (max-width:1100px) { #home-automation-project-status .ha-status-name { display:none; } }
  @media (max-width:700px) { #nr-dashboard-toolbar { flex-wrap:wrap; height:auto; min-height:64px; padding:8px 12px; gap:6px; } #nr-dashboard-toolbar h1 { font-size:17px; } #home-automation-project-status { margin-left:4px; } #dashboard-reconnect-button { font-size:0; width:28px; min-width:28px; margin:0!important; } #dashboard-reconnect-button::after { content:"↻"; font-size:19px; } #clock { font-size:11px; } #home-automation-project-hash { font-size:10px; margin-left:auto; } }
  @media (max-width:520px) { #home-automation-project-info-panel .ha-info-grid { grid-template-columns:1fr; } }

/* GEORGSHOME GRAUSTUFEN v0.14.2: Fokus und Bedienzustände zentral anpassen.
   Keine Größen-/Layoutänderungen; Statusfarben bleiben in den Fachtemplates. */
body.nr-dashboard-theme :is(button,input,select,textarea,a,summary):focus-visible {
 outline:2px solid #f0f0f0 !important;outline-offset:3px;
}
body.nr-dashboard-theme :is(button,input,select,textarea):disabled {
 cursor:not-allowed;opacity:.55;
}
body.nr-dashboard-theme :is(input,select,textarea) {color-scheme:dark;}
body.nr-dashboard-theme button:not(:disabled):hover {filter:brightness(1.13);}
body.nr-dashboard-theme button:not(:disabled):active {filter:brightness(.90);}
body.nr-dashboard-theme table {font-variant-numeric:tabular-nums;}

@media (max-width:700px) {
 body.nr-dashboard-theme md-toolbar { height:88px!important; min-height:88px!important; }
 #nr-dashboard-toolbar { display:grid; grid-template-columns:minmax(0,1fr) auto auto; grid-template-rows:32px 28px; height:88px!important; box-sizing:border-box; }
 #nr-dashboard-toolbar h1:not(.ng-hide) { grid-column:1; grid-row:1; font-size:16px; }
 #home-automation-project-status { grid-column:2 / 4; grid-row:1; margin:0; gap:6px; }
 #dashboard-reconnect-button { grid-column:1; grid-row:2; justify-self:start; }
 #nr-dashboard-toolbar > div:has(> #clock) { grid-column:2; grid-row:2; margin:0!important; }
 #home-automation-project-hash { grid-column:3; grid-row:2; margin:0 0 0 8px; }
}

<script>
(function(){
 'use strict';
 // Globales Head-Template: kein Angular-scope. Vorhandene Instanz sauber ablösen.
 if(window.GeorgDashboardTheme && window.GeorgDashboardTheme.dispose)window.GeorgDashboardTheme.dispose();
 const KEY='georgshome.dashboard.theme.v1';
 const allowed=['grays','dark','blues','greens'];
 const normalize=value=>allowed.indexOf(value)>=0?value:'grays';
 const service={current:'grays',warning:'',apply:function(value,persist){
  this.current=normalize(value);this.warning='';
  document.documentElement.setAttribute('data-gh-theme',this.current);
  if(persist){try{window.localStorage.setItem(KEY,this.current);}catch(e){this.warning='Speichern im Browser nicht möglich. Auswahl gilt nur für diese Sitzung.';}}
  window.dispatchEvent(new CustomEvent('georg-theme-changed'));
 }};
 let initial='grays';try{initial=window.localStorage.getItem(KEY);}catch(e){service.warning='Browserspeicher nicht verfügbar.';}
 const initialWarning=service.warning;window.GeorgDashboardTheme=service;service.apply(initial,false);service.warning=initialWarning;
 function storage(event){if(event.key===KEY||event.key===null)service.apply(event.newValue,false);}
 window.addEventListener('storage',storage);
 service.dispose=function(){window.removeEventListener('storage',storage);};
})();
</script>

 md-sidenav ui-icon[icon="girl"] > * {display:none}
 md-sidenav ui-icon[icon="girl"]::before {content:"👧";font:22px/1 "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
 dialog.gh-restart {

 }
 dialog.gh-restart::backdrop {background:rgba(10,12,16,.68)}

 .gh-restart h2 {margin:16px 0 8px;font-size:22px;line-height:1.25}

 .gh-restart footer {display:flex;justify-content:flex-end;flex-wrap:wrap;gap:10px;margin-top:24px}
 .gh-restart button {min-height:44px;padding:8px 16px;border-radius:8px;border:1px solid var(--gh-border,#777);background:transparent;color:inherit;font:inherit;cursor:pointer}
 .gh-restart button[value=yes] {background:#ffcf89;color:#352305;border-color:#ffcf89;font-weight:650}
</style>
<script>
window.georgConfirmNodeRedRestart = function(onConfirm) {
  if (document.querySelector("dialog.gh-restart")) return;
  var dialog = document.createElement("dialog");
  dialog.className = "gh-restart";
  dialog.setAttribute("aria-labelledby", "gh-restart-heading");
  dialog.setAttribute("aria-describedby", "gh-restart-message");
  dialog.innerHTML = '<span class="gh-restart-icon" aria-hidden="true">↻</span>' +
    '<h2 id="gh-restart-heading">Node-RED neu starten?</h2>' +
    '<p id="gh-restart-message">Alle Automationen und das Dashboard werden kurz unterbrochen.</p>' +
    '<footer><button type="button" value="no" autofocus>Nein</button>' +
    '<button type="button" value="yes">Ja, neu starten</button></footer>';
  dialog.addEventListener("click", function(event) {
    if (event.target.matches("button")) dialog.close(event.target.value);
  });
  dialog.addEventListener("close", function() {
    dialog.remove();
    if (dialog.returnValue === "yes") onConfirm();
  }, {once:true});
  document.body.appendChild(dialog);
  dialog.showModal();
};
</script>
