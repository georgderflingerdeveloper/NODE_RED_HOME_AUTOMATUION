<script type="text/javascript">
  RED.nodes.registerType("home-automation-credential-vault", {
    category: "storage",
    color: "#244d52",
    defaults: {
      name: { value: "Verschlüsselter System-Zugangstresor" },
      vaultPath: { value: "system-credentials.vault.json", required: true },
      autoLockMinutes: { value: 10, required: true, validate: RED.validators.number() }

<script type="text/html" data-template-name="home-automation-credential-vault">

<script type="text/html" data-help-name="home-automation-credential-vault">
  <p>Speichert SSH-Zugangsdaten mit AES-256-GCM verschlüsselt außerhalb von <code>flows.json</code>. Der Master-Schlüssel bleibt nur bis zur automatischen Sperre im Arbeitsspeicher.</p>
  <p>Ausgang 1 liefert ausschließlich Dashboard-Antworten. Ausgang 2 liefert bereinigte SSH-Systemwerte ohne Zugangsdaten.</p>
</script>
