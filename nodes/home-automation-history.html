<script type="text/x-red" data-help-name="home-automation-history">
  <p>SolarEdge: Site-ID und Site-API-Schlüssel hier hinterlegen. Der Schlüssel bleibt im Node-RED-Credential-Speicher. Alternativ SOLAREDGE_SITE_ID/SOLAREDGE_API_KEY als Server-Umgebungsvariablen. Anlagen-Zeitzone: Europe/Vienna. Automatischer Abgleich alle sechs Stunden, standardmäßig sieben Tage rückwirkend. Ältere Zeiträume im Menü SolarEdge Vergleich auswählen. Die letzten zwei Stunden werden wegen Cloud-Verzögerung nicht importiert. Lokale Rohdaten bleiben erhalten.</p>
  <p>Speichert fachliche Telemetrie sicher in einer projektlokalen SQLite-Datenbank.</p>
  <p><code>history/source/energy</code>, <code>history/source/weather</code> und
    <code>aWATTar/tariff/current</code> aktualisieren die Datenquellen.</p>
  <p><code>history/hourly-snapshot</code> schreibt den aktuellen Stundenstand,
    <code>history/dashboard</code> liefert Tag/Monat/Jahr und
    <code>history/backup</code> erstellt ein SQLite-konsistentes Backup.</p>
